# Settings, one a line: name value. The client and the server each read this file at
# startup and take what is theirs, so both live here; the command line has the last
# word. `client -cvars` and `server -cvars` print every setting with what it is set to.
# Lines are commented with # or //.

# --- the server
# sv_map          ctf_Ash,Arena   # several play in turn, a round each
# sv_bots         5
# sv_bots_difficulty 100           # how well they aim: 300 stupid, 10 impossible
# sv_bots_chat    1
# sv_timelimit    15              # minutes a round lasts
# sv_scorelimit   10              # captures that win it
# sv_friendlyfire 0
# sv_maxrewind    500             # ms: how far back a shot is judged at most
# sv_votepercent  60              # of those who can vote, how many must agree

# --- the client
# cl_name         Major
# cl_window       1
# snd_volume      0.12

# --- a simulated bad line, for testing
# net_ping        120             # the round trip in ms
# net_jitter      30
# net_loss        5               # percent of packets

# --- the keys: what each does, as key names by comma, in any case. A letter or a digit,
# space, tab, enter, left_shift, left_control, left_alt, f1 to f12, up, down, left,
# right, kp_0 to kp_9; mouse_left, mouse_right, mouse_middle, mouse_side, mouse_extra.
# Nothing after the name binds nothing. Escape and the menus' number keys are fixed.
bind_left         a
bind_right        d
bind_jump         w
bind_crouch       s
bind_prone        x
bind_jet          space
bind_fire         mouse_left
bind_throw        e,mouse_right
bind_reload       r
bind_change       q
bind_drop         f
bind_suicide      k
bind_flag_throw
bind_chat         t
bind_team_chat    y
bind_scores       f1
bind_minimap      f3
bind_weapons_menu tab
bind_team_menu    m
bind_vote_yes     f12
bind_vote_no      f11
